    <script>
        const app = {
            currentUser: null,
            allUsers: [],
            allPosts: [],
            allQuestions: [],
            activeView: 'auth',
            authMode: 'login',
            authRole: 'penulis',
            categories: [
                { id: 'ling', name: 'Linguistik', icon: '📝' }, { id: 'sas', name: 'Sastra', icon: '📖' }, { id: 'opini', name: 'Opini', icon: '💡' },
                { id: 'res', name: 'Resensi', icon: '📚' }, { id: 'sos', name: 'Sosial', icon: '🌍' }, { id: 'agama', name: 'Agama', icon: '☪️' }, { id: 'budaya', name: 'Budaya', icon: '🏺' }
            ],

            async init() {
                const check = setInterval(() => {
                    if (window.firebaseReady) {
                        clearInterval(check);
                        this.setupAuth();
                        this.renderCategories();
                    }
                }, 100);
            },

            async setupAuth() {
                const { onAuthStateChanged, signInAnonymously, signInWithCustomToken } = window.fb_auth_methods;
                
                // Cek token awal
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(window.app_auth, __initial_auth_token);
                } else {
                    await signInAnonymously(window.app_auth);
                }

                onAuthStateChanged(window.app_auth, (user) => {
                    if (user) this.listenData(user);
                });
            },

            listenData(user) {
                const { collection, onSnapshot } = window.fb_tools;
                const db = window.app_db;
                const appId = window.app_id;

                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
                    this.allUsers = snap.docs.map(d => d.data());
                    const me = this.allUsers.find(u => u.uid === user.uid);
                    if (me) {
                        this.currentUser = me;
                        this.onReady();
                    }
                }, (err) => console.error(err));

                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), (snap) => {
                    this.allPosts = snap.docs.map(d => d.data());
                    this.refreshView();
                }, (err) => console.error(err));

                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'questions'), (snap) => {
                    this.allQuestions = snap.docs.map(d => d.data());
                    this.updateQuizUI();
                }, (err) => console.error(err));
            },

            onReady() {
                document.getElementById('navMenu').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('view-auth').classList.add('hidden-view');
                document.getElementById('navAvatar').src = this.currentUser.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(this.currentUser.fullName)}`;
                document.getElementById('navAdmin').classList.toggle('hidden', this.currentUser.role !== 'admin');
                if (this.activeView === 'auth') this.navigate('home');
            },
            async handleAuth(e) {
                e.preventDefault();
                const username = document.getElementById('authUsername').value.trim().toLowerCase();
                const password = document.getElementById('authPassword').value;
                const uid = window.app_auth.currentUser?.uid;

                if (!uid) {
                    alert("Koneksi belum stabil. Silakan tunggu sebentar atau refresh.");
                    return;
                }

                if (this.authMode === 'register') {
                    const fullName = document.getElementById('regName').value.trim();
                    const kelas = document.getElementById('regKelas').value.trim();
                    
                    if (!fullName || !username || !password || !kelas) {
                        return alert("Lengkapi data: Nama, Kelas, Username, dan Password!");
                    }

                    const userExists = this.allUsers.some(u => u.username === username);
                    if (userExists) return alert("Username sudah digunakan! Pilih yang lain.");

                    const userData = {
                        uid: uid, 
                        username: username, 
                        password: password, 
                        fullName: fullName, 
                        kelas: kelas,
                        role: 'penulis', 
                        score: 0, 
                        rank: 'BRONZE', 
                        avatar: '', 
                        registeredAt: Date.now()
                    };
                    
                    try {
                        // Simpan ke Firestore
                        await window.fb_tools.setDoc(
                            window.fb_tools.doc(window.app_db, 'artifacts', window.app_id, 'public', 'data', 'users', uid), 
                            userData
                        );
                        
                        // INI KUNCI AGAR TIDAK STUCK:
                        this.currentUser = userData; // Isi data user lokal
                        alert("Pendaftaran Berhasil!");
                        this.onReady(); // Paksa pindah ke halaman Home
                    } catch (err) {
                        console.error("Gagal Daftar:", err);
                        alert("Gagal mendaftar: " + err.message);
                    }
                } else {
                    // Logika Login
                    const found = this.allUsers.find(u => u.username === username && u.password === password);
                    if (!found) return alert("Username atau password salah.");
                    
                    if (this.authRole === 'admin' && found.role !== 'admin') {
                        return alert("Anda bukan admin!");
                    }
                    
                    this.currentUser = found;
                    this.onReady();
                }
            },


            toggleAuthMode() {
                this.authMode = this.authMode === 'login' ? 'register' : 'login';
                const regFields = document.getElementById('regFields');
                const submitBtn = document.getElementById('authSubmitBtn');
                const toggleBtn = document.getElementById('authToggleBtn');
                const toggleText = document.getElementById('authToggleText');

                if (this.authMode === 'register') {
                    regFields.classList.remove('hidden');
                    submitBtn.textContent = 'Daftar';
                    toggleBtn.textContent = 'Masuk';
                    toggleText.textContent = 'Sudah punya akun?';
                } else {
                    regFields.classList.add('hidden');
                    submitBtn.textContent = 'Masuk';
                    toggleBtn.textContent = 'Daftar';
                    toggleText.textContent = 'Belum punya akun?';
                }
            },

            navigate(view, extra = null) {
                this.activeView = view;
                document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden-view'));
                document.getElementById(`view-${view}`).classList.remove('hidden-view');
                
                if (view === 'category' && extra) this.renderCategoryPage(extra);
                if (view === 'leaderboard') this.renderLeaderboard();
                if (view === 'admin') this.renderAdmin();
                this.refreshView();
            },

            refreshView() {
                if (this.activeView === 'home') this.renderHome();
            },

            renderCategories() {
                const grid = document.getElementById('categoryGrid');
                const sel = document.getElementById('editCategory');
                grid.innerHTML = this.categories.map(c => `
                    <div onclick="app.navigate('category', '${c.name}')" class="bg-white dark:bg-zinc-900 p-5 rounded-3xl text-center border dark:border-zinc-800 cursor-pointer hover:shadow-lg transition active:scale-95">
                        <span class="text-3xl">${c.icon}</span>
                        <p class="text-[10px] font-black uppercase mt-2 text-gray-400">${c.name}</p>
                    </div>`).join('');
                sel.innerHTML = this.categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            },

            renderHome() {
                const grid = document.getElementById('latestPostsGrid');
                const pubs = this.allPosts.filter(p => p.status === 'published').sort((a,b) => b.createdAt - a.createdAt);
                grid.innerHTML = pubs.map(p => this.createCard(p)).join('');
            },

            renderCategoryPage(catName) {
                document.getElementById('categoryPageTitle').textContent = catName;
                const grid = document.getElementById('categoryPostsGrid');
                const filtered = this.allPosts.filter(p => p.category === catName && p.status === 'published');
                grid.innerHTML = filtered.length ? filtered.map(p => this.createCard(p)).join('') : '<p class="text-center py-10 opacity-50 col-span-full">Belum ada karya di kategori ini.</p>';
            },

            createCard(p) {
                const author = this.allUsers.find(u => u.uid === p.authorUid);
                return `
                <div class="bg-white dark:bg-zinc-900 border dark:border-zinc-800 p-6 rounded-3xl cursor-pointer hover:shadow-xl transition flex flex-col h-full" onclick="app.openReader('${p.id}')">
                    <span class="text-[9px] font-black uppercase bg-brand-50 text-brand-600 px-2 py-1 rounded-full self-start">${p.category}</span>
                    <h3 class="font-black text-lg my-4 line-clamp-2 flex-grow">${p.title}</h3>
                    <div class="flex items-center gap-2 pt-4 border-t dark:border-zinc-800" onclick="event.stopPropagation(); app.openProfile('${p.authorUid}')">
                        <img src="${author?.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(author?.fullName || 'U')}`}" class="w-6 h-6 rounded-full">
                        <span class="text-[10px] font-bold">@${author?.username || 'anon'}</span>
                    </div>
                </div>`;
            },

            openReader(id) {
                const p = this.allPosts.find(x => x.id === id);
                if (!p) return;
                document.getElementById('readerTitle').textContent = p.title;
                document.getElementById('readerBody').textContent = p.content;
                document.getElementById('readerModal').classList.remove('hidden');
            },

            closeReader: () => document.getElementById('readerModal').classList.add('hidden'),

            openProfile(uid) {
                const u = this.allUsers.find(x => x.uid === uid);
                if (!u) return;
                document.getElementById('profileName').textContent = u.fullName;
                document.getElementById('profileMeta').textContent = `${u.kelas} • @${u.username}`;
                document.getElementById('profileScore').textContent = `${u.score || 0} PTS`;
                document.getElementById('profileAvatar').src = u.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.fullName)}`;
                
                const posts = this.allPosts.filter(p => p.authorUid === uid && p.status === 'published');
                document.getElementById('profilePostsGrid').innerHTML = posts.map(p => this.createCard(p)).join('');
                this.navigate('profile');
            },

            renderLeaderboard() {
                const list = document.getElementById('leaderboardList');
                const sorted = [...this.allUsers].sort((a,b) => (b.score || 0) - (a.score || 0));
                list.innerHTML = sorted.map((u, i) => `
                    <div class="flex items-center justify-between p-5 border-b dark:border-zinc-800">
                        <div class="flex items-center gap-4">
                            <span class="font-black text-gray-400 w-4">${i+1}</span>
                            <img src="${u.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.fullName)}`}" class="w-8 h-8 rounded-full">
                            <span class="font-bold">${u.fullName}</span>
                        </div>
                        <span class="font-black text-brand-600">${u.score || 0}</span>
                    </div>`).join('');
            },

            async savePost() {
                const title = document.getElementById('editTitle').value;
                const category = document.getElementById('editCategory').value;
                const content = document.getElementById('editContent').value;
                if (!title || !content) return alert("Isi judul dan konten!");

                const id = Date.now().toString();
                await window.fb_tools.setDoc(window.fb_tools.doc(window.app_db, 'artifacts', window.app_id, 'public', 'data', 'posts', id), {
                    id, title, category, content, authorUid: this.currentUser.uid, status: 'pending', createdAt: Date.now()
                });
                this.closeEditor();
                alert("Karya dikirim! Tunggu moderasi admin.");
            },

            async saveQuestion() {
                const q = document.getElementById('qInput').value;
                const a = document.getElementById('qOptA').value;
                const b = document.getElementById('qOptB').value;
                const c = document.getElementById('qOptC').value;
                const d = document.getElementById('qOptD').value;
                if (!q || !a) return alert("Isi soal dan jawaban benar!");

                const id = Date.now().toString();
                await window.fb_tools.setDoc(window.fb_tools.doc(window.app_db, 'artifacts', window.app_id, 'public', 'data', 'questions', id), {
                    id, q, options: [a,b,c,d], correct: a
                });
                alert("Soal berhasil disimpan!");
            },

            updateQuizUI() {
                const msg = document.getElementById('quiz-status-msg');
                const btn = document.getElementById('startQuizBtn');
                if (this.allQuestions.length > 0) {
                    msg.textContent = `${this.allQuestions.length} Soal kuis tersedia.`;
                    btn.classList.remove('hidden');
                } else {
                    msg.textContent = "Belum ada kuis yang tersedia dari admin.";
                    btn.classList.add('hidden');
                }
            },

            renderAdmin() {
                const list = document.getElementById('adminPostList');
                const pending = this.allPosts.filter(p => p.status === 'pending');
                list.innerHTML = pending.length ? pending.map(p => `
                    <div class="bg-white dark:bg-zinc-900 p-4 rounded-2xl border flex justify-between items-center gap-4">
                        <div class="overflow-hidden">
                            <p class="font-bold truncate">${p.title}</p>
                            <p class="text-xs opacity-50">${p.category}</p>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            <button onclick="app.mod('${p.id}', 'published')" class="bg-green-600 text-white px-3 py-1 rounded-lg text-xs font-bold">TERIMA</button>
                            <button onclick="app.mod('${p.id}', 'rejected')" class="bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-bold">TOLAK</button>
                        </div>
                    </div>`).join('') : '<p class="text-center py-4 opacity-50">Tidak ada karya tertunda.</p>';
                
                const qList = document.getElementById('adminQuestionList');
                qList.innerHTML = this.allQuestions.map(q => `
                    <div class="p-3 border rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 flex justify-between items-center">
                        <span class="truncate pr-4">${q.q}</span>
                        <button onclick="app.deleteQuestion('${q.id}')" class="text-red-500">Hapus</button>
                    </div>`).join('');
            },

            async deleteQuestion(id) {
                if (confirm("Hapus soal ini?")) {
                    await window.fb_tools.deleteDoc(window.fb_tools.doc(window.app_db, 'artifacts', window.app_id, 'public', 'data', 'questions', id));
                }
            },

            async mod(id, stat) {
                await window.fb_tools.updateDoc(window.fb_tools.doc(window.app_db, 'artifacts', window.app_id, 'public', 'data', 'posts', id), { status: stat });
            },

            setAuthRole(r) { 
                this.authRole = r; 
                document.getElementById('roleBtnPenulis').className = r === 'penulis' ? 'flex-1 py-2 text-xs font-bold rounded-lg transition bg-white dark:bg-zinc-700 shadow-sm text-brand-600' : 'flex-1 py-2 text-xs font-bold rounded-lg transition text-gray-500'; 
                document.getElementById('roleBtnAdmin').className = r === 'admin' ? 'flex-1 py-2 text-xs font-bold rounded-lg transition bg-white dark:bg-zinc-700 shadow-sm text-blue-600' : 'flex-1 py-2 text-xs font-bold rounded-lg transition text-gray-500'; 
            },

            setAdminTab(t) { 
                document.getElementById('admin-tab-posts').classList.toggle('hidden', t !== 'posts'); 
                document.getElementById('admin-tab-quiz').classList.toggle('hidden', t !== 'quiz'); 
            },

            openEditor: () => document.getElementById('editorModal').classList.remove('hidden'),
            closeEditor: () => document.getElementById('editorModal').classList.add('hidden'),
            logout: () => { location.reload(); }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
